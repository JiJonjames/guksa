<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="한국사 시험 범위(한국사1 p.137–153, 한국사2 p.8–29) 암기 학습 앱">
<title>Recall — 한국사</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230066cc'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3ER%3C/text%3E%3C/svg%3E">
<style>:root{
  --blue:#0066cc;--focus:#0071e3;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#86868b;
  --bg:#ffffff;--bg2:#f5f5f7;--pearl:#fafafc;--line:#e0e0e0;--card:#ffffff;
  --ok:#1f8a4c;--okbg:#e8f5ec;--bad:#c9341f;--badbg:#fdecea;--warn:#b25e00;
  --r:18px;--rs:8px;--t:200ms cubic-bezier(.25,.1,.25,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.04);
  color-scheme:light;
}
html[data-theme="dark"]{
  --blue:#2997ff;--focus:#2997ff;--ink:#f5f5f7;--ink2:#a1a1a6;--ink3:#86868b;
  --bg:#000000;--bg2:#161617;--pearl:#1c1c1e;--line:#333336;--card:#272729;
  --ok:#3ecf7a;--okbg:#10301e;--bad:#ff6b5a;--badbg:#3a1714;--warn:#ffb340;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:17px;line-height:1.55;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.h-hero{font-size:56px;font-weight:600;letter-spacing:-.035em;line-height:1.07}
.h-sec{font-size:40px;letter-spacing:-.03em}
.h-sub{font-size:28px;font-weight:600}
.cap{font-size:14px;color:var(--ink2)}
.muted{color:var(--ink2)}
.tiny{font-size:12px;color:var(--ink3)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--pearl);padding:20px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{font-weight:600;font-size:20px;padding:4px 12px 16px;letter-spacing:-.02em}
.brand span{color:var(--ink2);font-weight:500}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink);font-size:15px;min-height:40px;border:0;background:none;width:100%;text-align:left;cursor:pointer;transition:background var(--t)}
.nav:hover{background:var(--bg2)}
.nav.on{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.nav .ic{width:20px;text-align:center;opacity:.85}
.nav .badge{margin-left:auto;font-size:12px;background:var(--blue);color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
.side .foot{margin-top:auto;padding:12px;font-size:13px;color:var(--ink2)}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width var(--t)}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 28px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);padding:0 12px 0 34px;font-size:15px}
.search .sic{position:absolute;left:11px;top:8px;color:var(--ink3)}
.sres{position:absolute;top:42px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.12);max-height:60vh;overflow:auto;padding:6px;display:none}
.sres.on{display:block}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.sres button:hover,.sres button:focus{background:var(--bg2)}
.page{padding:36px 28px 120px;max-width:1080px;margin:0 auto}
.page.wide{max-width:1280px}
.mnav{display:none}

/* components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;background:var(--blue);color:#fff;font-size:16px;cursor:pointer;transition:transform 120ms,background var(--t),opacity var(--t);white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn:hover{background:var(--focus)}
.btn.ghost{background:transparent;color:var(--blue);border-color:var(--blue)}
.btn.ghost:hover{background:color-mix(in srgb,var(--blue) 8%,transparent)}
.btn.plain{background:var(--bg2);color:var(--ink);border-color:var(--line)}
.btn.plain:hover{background:var(--line)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;transition:all var(--t)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card.pearl{background:var(--pearl)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.stack>*+*{margin-top:14px}
.sec{margin-top:56px}
.sec>h2{margin-bottom:18px}
.stat .v{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.stat .l{font-size:14px;color:var(--ink2);margin-top:4px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--bg2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.tag.blue{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 35%,transparent);background:color-mix(in srgb,var(--blue) 7%,transparent)}
.tag.ok{color:var(--ok);background:var(--okbg);border-color:transparent}
.tag.bad{color:var(--bad);background:var(--badbg);border-color:transparent}
.tag.warn{color:var(--warn)}
input.inp,select.inp,textarea.inp{border:1px solid var(--line);border-radius:var(--rs);background:var(--card);padding:9px 12px;min-height:44px;font-size:16px;width:100%}
textarea.inp{min-height:160px;resize:vertical;line-height:1.6}
input.inp:focus,textarea.inp:focus,select.inp:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 20%,transparent)}
.seg{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:14px;cursor:pointer;min-height:34px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
hr.hl{border:0;border-top:1px solid var(--line);margin:22px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.kbd{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--bg2);color:var(--ink2)}
.empty{padding:40px;text-align:center;color:var(--ink2)}
.list>*{border-bottom:1px solid var(--line);padding:14px 2px}
.list>*:last-child{border-bottom:0}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:100;opacity:0;transition:opacity var(--t);pointer-events:none}
.toast.on{opacity:1}

/* home */
.hero{text-align:center;padding:40px 0 8px}
.hero p{font-size:21px;color:var(--ink2);margin:16px auto 28px;max-width:640px}
.tlmini{display:flex;height:56px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.tlmini button{flex:1;border:0;border-right:1px solid var(--line);background:var(--pearl);cursor:pointer;font-size:13px;padding:6px;text-align:left}
.tlmini button:last-child{border-right:0}
.tlmini button:hover{background:var(--bg2)}

/* timeline */
.tl-period{margin-top:40px}
.tl-period h3{font-size:24px;margin-bottom:4px}
.tl-year{display:grid;grid-template-columns:84px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.tl-year .yr{font-size:22px;font-weight:600;letter-spacing:-.02em;position:sticky;top:64px;align-self:start}
.tl-ev{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:10px 12px;border-radius:12px;cursor:pointer;transition:background var(--t)}
.tl-ev:hover{background:var(--bg2)}
.tl-ev.open{background:var(--pearl);border-color:var(--line)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:8px;flex:none;background:var(--line)}
.dot.s1{background:color-mix(in srgb,var(--blue) 35%,var(--line))}.dot.s2{background:var(--bad)}.dot.s3{background:color-mix(in srgb,var(--blue) 70%,var(--line))}.dot.s4{background:var(--blue)}
.tl-ev .ttl{font-weight:600}
.tl-ev .md{font-size:13px;color:var(--ink2);min-width:64px}
.unord{border-left:2px dashed var(--line);padding-left:10px;margin-left:4px}
.detail{padding:6px 14px 16px 34px}
.detail dl{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;margin:8px 0;font-size:15px}
.detail dt{color:var(--ink2)}
.detail dd{margin:0}
.hidden-txt{background:var(--line);color:transparent!important;border-radius:4px;user-select:none}
.hover-reveal:hover .hidden-txt{background:none;color:inherit!important}
.overview{display:flex;gap:2px;align-items:flex-end;height:64px;margin:16px 0;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--pearl);overflow-x:auto}
.overview button{flex:1;min-width:8px;border:0;background:color-mix(in srgb,var(--blue) 45%,transparent);border-radius:3px 3px 0 0;cursor:pointer;padding:0}
.overview button:hover{background:var(--blue)}

/* library */
.mod-card{display:block;text-align:left;cursor:pointer;transition:border-color var(--t),transform var(--t);color:inherit}
.mod-card:hover{border-color:var(--blue)}
.mod-card .n{font-size:13px;color:var(--ink2)}
.steps{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:22px 0;overflow-x:auto}
.steps button{border:0;background:none;padding:12px 14px;font-size:15px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;min-height:44px}
.steps button.on{border-color:var(--ink);font-weight:600}
.analogy{background:var(--pearl);border:1px dashed var(--line);border-radius:var(--r);padding:20px 22px;font-size:19px;line-height:1.7}
.analogy .lbl{font-size:12px;color:var(--ink2);display:block;margin-bottom:6px;letter-spacing:.02em}
.mn{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card)}
.mn summary{padding:14px 18px;display:flex;align-items:center;gap:10px;min-height:44px}
.mn summary b{font-size:20px;letter-spacing:.02em}
.mn .body{padding:0 18px 16px}
.mn table{border-collapse:collapse;width:100%}
.mn td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.mn td:first-child{font-weight:600;white-space:nowrap;width:1%}
.cloze-q{font-size:20px;line-height:2.1}
.blank{display:inline-block;min-width:110px;border:0;border-bottom:2px solid var(--blue);background:color-mix(in srgb,var(--blue) 6%,transparent);padding:0 8px;margin:0 3px;font-size:18px;border-radius:6px 6px 0 0;text-align:center;height:36px}
.blank.ok{border-color:var(--ok);background:var(--okbg)}
.blank.bad{border-color:var(--bad);background:var(--badbg)}
.reveal-ans{font-size:15px;margin-top:6px}

/* visuals */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow .st{flex:1;min-width:130px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);position:relative}
.flow .st .d{font-size:12px;color:var(--blue);font-weight:600}
.flow .st .n{font-weight:600;margin:2px 0}
.flow .st .s{font-size:13px;color:var(--ink2)}
.flow .ar{align-self:center;color:var(--ink3)}
.contrast{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.contrast>div{padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.contrast>div:nth-child(-n+2){border-top:0;font-weight:600;background:var(--bg2)}
.contrast>div:nth-child(even){border-left:1px solid var(--line)}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stages .sg{border:1px solid var(--line);border-radius:14px;padding:14px}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.hub .c{grid-column:1/-1;text-align:center;font-weight:600;font-size:20px;padding:10px;border-radius:14px;background:var(--bg2)}
.hub .s{border:1px solid var(--line);border-radius:14px;padding:12px}
.maps svg{width:100%;height:auto;display:block}
.region{cursor:pointer}
.region circle{fill:var(--blue);transition:r var(--t)}
.region:hover circle,.region.on circle{fill:var(--focus)}
.region text{font-size:13px;fill:var(--ink);font-weight:600}
.mapbg{fill:var(--pearl)}
.land{fill:var(--bg2);stroke:var(--ink3);stroke-width:1}
.grat{stroke:var(--line);stroke-width:.6}

/* flashcards */
.fc-wrap{perspective:1600px;max-width:760px;margin:0 auto}
.fc{position:relative;min-height:360px;transform-style:preserve-3d;transition:transform 450ms cubic-bezier(.2,.7,.2,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:24px;background:var(--card);padding:34px;display:flex;flex-direction:column;overflow:auto}
.fc .back{transform:rotateY(180deg)}
.fc .q{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.3;margin:auto 0}
.fc .a{font-size:30px;font-weight:600;color:var(--blue);letter-spacing:-.02em;line-height:1.25}
@media (prefers-reduced-motion:reduce){.fc .face{backface-visibility:visible}.fc.flip .front{display:none}.fc:not(.flip) .back{display:none}.fc.flip{transform:none}.fc .back{transform:none}}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:760px;margin:16px auto 0}
.rate button{min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px;transition:transform 120ms}
.rate button:active{transform:scale(.95)}
.rate button small{display:block;font-size:12px;color:var(--ink2)}
.rate .r1{color:var(--bad)}.rate .r4{color:var(--blue)}
body.focus .side,body.focus .top,body.focus .mnav,body.focus .nofocus{display:none!important}
body.focus .app{grid-template-columns:1fr}
body.focus .page{padding-top:28px}

/* drill */
.ordl{list-style:none;padding:0;margin:0;max-width:640px}
.ordl li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card);cursor:grab;user-select:none}
.ordl li.drag{opacity:.4}
.ordl li.ok{border-color:var(--ok);background:var(--okbg)}
.ordl li.bad{border-color:var(--bad);background:var(--badbg)}
.ordl .num{width:26px;height:26px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:13px;flex:none}
.ordl .mv{margin-left:auto;display:flex;gap:4px}
.ordl .mv button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);cursor:pointer}

/* exam */
.exam-grid{display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:start}
.qnav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:sticky;top:70px}
.qnav button{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;position:relative}
.qnav button.ans{background:color-mix(in srgb,var(--blue) 12%,transparent);border-color:var(--blue)}
.qnav button.cur{outline:2px solid var(--ink)}
.qnav button.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:48px;font-size:16px}
.opt.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 8%,transparent)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt .k{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.src{background:var(--pearl);border-left:3px solid var(--ink3);padding:12px 16px;border-radius:6px;font-size:15px;line-height:1.7;margin:10px 0}
.timer{font-variant-numeric:tabular-nums;font-weight:600}

/* blank page */
.bp-editor textarea{min-height:52vh;font-size:18px;line-height:1.75;border-radius:16px;padding:20px}
.kwl{display:flex;flex-wrap:wrap;gap:6px}
.kwl label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;cursor:pointer}
.kwl label.hit{border-color:var(--ok);background:var(--okbg)}
.kwl label.miss{border-color:var(--bad);background:var(--badbg)}

/* stats */
.bar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.bar .t{width:140px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .b{flex:1;height:10px;border-radius:6px;background:var(--bg2);overflow:hidden}
.bar .b i{display:block;height:100%;background:var(--blue)}
.bar .v{width:52px;text-align:right;color:var(--ink2)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.heat button{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;text-align:left;min-height:60px;cursor:pointer;line-height:1.3}
.cols{display:flex;align-items:flex-end;gap:4px;height:120px}
.cols div{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px;position:relative}
table.tbl{border-collapse:collapse;width:100%;font-size:15px}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:9px 10px;vertical-align:top;text-align:left}
table.tbl th{background:var(--bg2);font-weight:600}
table.tbl td.hidecell{background:var(--pearl)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.36);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:22px;max-width:520px;width:100%;padding:26px;max-height:90vh;overflow:auto;border:1px solid var(--line)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:8px 14px}
  .page{padding:22px 16px 110px}
  .h-hero{font-size:38px}.h-sec{font-size:30px}.h-sub{font-size:22px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
  .exam-grid{grid-template-columns:1fr}
  .qnav{position:static;grid-template-columns:repeat(8,1fr)}
  .stages{grid-template-columns:1fr}
  .tl-year{grid-template-columns:56px 1fr;gap:8px}.tl-year .yr{font-size:17px}
  .detail{padding-left:12px}.detail dl{grid-template-columns:84px 1fr}
  .fc .q{font-size:22px}.fc .a{font-size:24px}.fc .face{padding:22px}

  { id: 'c35', t: '토지 조사 사업의 결과', body: '통감부가 국유지로 편입한 황실 토지 → 총독부 소유 또는 동양 척식 주식회사로. 실제 경작 농민과 분쟁. 지주 소유권 절대화 → 일본인·일부 한국인 대지주 성장. 총독부 지세 수입 증가(1910 600.1만 엔 → 1919 1,117.8만 엔). 농민의 관습적 경작권 부정 → 고율 소작료, 1920년대 소작 쟁의 배경, 화전민·만주·연해주·일본 이주. 동양 척식 주식회사(1908)는 토지를 일본인 이민자에게 싸게 팔거나 고율 소작료.', kw: ['동양 척식 주식회사', '경작권', '소작료', '소작 쟁의', '지세 수입'],

// ───────────────────────── scheduler (SM-2 variant) ─────────────────────────
/* rating 1 Again: immediate retry (1 min), streak reset, ease −0.2
   rating 2 Hard : new → 10 min; learned → interval×1.2, ease −0.15
   rating 3 Good : new → 1 day; 2nd → 3 days; then interval×ease
   rating 4 Easy : new → 4 days; then interval×ease×1.3, ease +0.15
   Exam date: intervals are capped so every card returns before the exam
   (cram mode when ≤7 days: cap = max(1, ⌊days/2⌋)). */
const daysLeft = () => { if (!SET.examDate) return null; const d = new Date(SET.examDate + 'T00:00:00'); return Math.ceil((d - new Date(today() + 'T00:00:00')) / DAY); };
const cramOn = () => SET.cram === 'on' || (SET.cram === 'auto' && daysLeft() !== null && daysLeft() >= 0 && daysLeft() <= 7);
const rec = id => S.rec[id] || (S.rec[id] = { n: 0, c: 0, w: 0, st: 0, reps: 0, ef: 2.5, iv: 0, due: 0, last: 0, lapses: 0, rt: 0, rtn: 0, days: [], sn: 0 });
function schedule(r, rating) {
  const now = Date.now();
  if (rating === 1) { r.lapses++; r.st = 0; r.reps = 0; r.ef = Math.max(1.3, r.ef - 0.2); r.iv = 0; r.due = now + 60e3; return; }
  r.st++;
  let iv;
  if (r.reps === 0) { iv = rating === 2 ? 0 : rating === 3 ? 1 : 4; }
  else if (rating === 2) { iv = Math.max(1, r.iv * 1.2); r.ef = Math.max(1.3, r.ef - 0.15); }
  else if (rating === 3) { iv = r.reps === 1 ? 3 : r.iv * r.ef; }
  else { iv = (r.reps === 1 ? 4 : r.iv * r.ef) * 1.3; r.ef += 0.15; }
  if (r.lapses >= 3 && iv > 2) iv = Math.min(iv, 2 + r.reps); // repeated failures stay close
  const dl = daysLeft();
  if (iv > 0 && dl !== null && dl > 0) { const cap = cramOn() ? Math.max(1, Math.floor(dl / 2)) : Math.max(1, Math.floor(dl * 0.6)); iv = Math.min(iv, cap); }
  if (cramOn() && iv > 2) iv = 2;
  r.iv = Math.round(iv * 10) / 10;
  r.due = iv === 0 ? now + 10 * 60e3 : now + r.iv * DAY;
  r.reps++;
}
function grade(id, rating, info = {}) {
  const r = rec(id), now = Date.now();
  const correct = rating >= 2;
  r.n++; correct ? r.c++ : r.w++; r.last = now; if (!r.sn) r.sn = now;
  if (info.rt) { r.rt += Math.min(info.rt, 120e3); r.rtn++; }
  if (correct) { const d = today(); if (!r.days.includes(d)) { r.days.push(d); if (r.days.length > 12) r.days.shift(); } }
  schedule(r, rating);
  const dd = S.day[today()] || (S.day[today()] = { sec: 0, n: 0, ok: 0 });
  dd.n++; if (correct) dd.ok++; dd.sec += Math.round(Math.min(info.rt || 15e3, 90e3) / 1000);
  const it = ITEMS[id];
  if (!correct && info.log !== false && it) {
    const e = S.err[id] || (S.err[id] = { id, count: 0, first: now, okDays: [] });
    e.count++; e.last = now; e.ua = info.ua ?? ''; e.okDays = []; e.kind = info.kind || it.kind;
  } else if (correct && S.err[id]) { const e = S.err[id]; const d = today(); if (!e.okDays.includes(d)) e.okDays.push(d); e.lastOk = now; }
  save();
}
const stateOf = id => { const r = S.rec[id]; if (!r || !r.n) return 0; if (r.due <= Date.now()) return 2; if (r.iv >= 14 && r.st >= 3) return 4; if (r.iv >= 3 && r.st >= 2) return 3; return 1; };

// ───────────────────────── session queue ─────────────────────────
function buildQueue(minutes, opts = {}) {
  const n = Math.max(8, Math.round(minutes * 4));
  const now = Date.now();
  const pool = CARDS.filter(c => (!opts.mod || c.mod === opts.mod) && (!opts.per || c.per === opts.per));
  const due = pool.filter(c => S.rec[c.id]?.n && S.rec[c.id].due <= now).sort((a, b) => S.rec[a.id].due - S.rec[b.id].due);
  const leech = pool.filter(c => !due.includes(c) && (S.rec[c.id]?.lapses || 0) >= 2).sort((a, b) => S.rec[b.id].lapses - S.rec[a.id].lapses);
  // unstudied, interleaved across modules in syllabus order
  const byMod = {}; pool.filter(c => !S.rec[c.id]?.n).forEach(c => (byMod[c.mod] = byMod[c.mod] || []).push(c));
  const mods = Object.keys(byMod).sort((a, b) => MOD[a].n - MOD[b].n);
  const fresh = []; const front = mods.slice(0, 3);
  for (let k = 0; fresh.length < n * 2 && front.some(m => byMod[m]?.length); k++) { const m = front[k % front.length]; if (byMod[m]?.length) fresh.push(byMod[m].shift()); if (!byMod[m]?.length) { const nx = mods.find(x => !front.includes(x) && byMod[x]?.length); if (nx) front[front.indexOf(m)] = nx; } }
  const confus = pool.filter(c => S.rec[c.id]?.w > 0 && !due.includes(c) && !leech.includes(c));
  const stale = pool.filter(c => S.rec[c.id]?.n && !due.includes(c)).sort((a, b) => S.rec[a.id].last - S.rec[b.id].last);
  const out = []; const seen = new Set();
  const take = (arr, max) => { for (const c of arr) { if (out.length >= max) break; if (!seen.has(c.id)) { seen.add(c.id); out.push(c.id); } } };
  take(due, n); take(leech, n); take(fresh, Math.min(n, out.length + Math.ceil(n * (cramOn() ? 0.35 : 0.6)))); take(confus, n); take(fresh, n); take(stale, n);
  return out;
}

  const recent = Object.values(S.err).filter(e => ITEMS[e.id]).sort((a, b) => b.last - a.last).slice(0, 5);

const bar = (t, v, lbl) => `<div class="bar"><span class="t" title="${esc(t)}">${esc(t)}</span><span class="b"><i style="width:${v}%"></i></span><span class="v">${lbl}</span></div>`;
function coverage() {
  const facts = CONCEPTS.flatMap(c => c.f.map(f => ({ c, q: f[0] })));
  const missing = facts.filter(x => !ITEMS[`f:${x.c.id}:${hash(x.q)}`]).map(x => x.q);
  const modsOK = MODULES.filter(m => m.feyn.length && m.concepts.length && CLOZES.filter(z => z.mod === m.id).length >= 3 && m.recall.length >= 2).length;
  const tf = 'TF·복수정답·순서·연결·비교: 연표·표에서 매 시험 자동 생성';
  return { missing, rows: [['교과서 사건(연표 반영 기준)', EVENTS.length], ['구현된 사건', `${EVENTS.length} (본문 ${EVENTS.filter(e => e.scope === 'text').length} · 연표·자료 ${EVENTS.filter(e => e.scope === 'table').length} · 보충 ${EVENTS.filter(e => e.scope === 'extra').length})`], ['개념(목표 64)', `${CONCEPTS.length}`], ['학습 모듈 4단계 완비', `${modsOK} / 20`], ['원자 사실', facts.length], ['암기 카드', `${CARDS.length} (사실 ${CARDS.filter(c => c.id.startsWith('f:')).length} · 연도 ${CARDS.filter(c => c.id.startsWith('ev:')).length} · 암기법 ${CARDS.filter(c => c.id.startsWith('mn:')).length})`], ['빈칸 문항', CLOZES.length], ['시험 문항 풀', `카드 기반 객관식 ${CARDS.filter(c => !c.self).length} + 사료 ${DOCQ.length} + 그래프 ${GRAPHQ.length} + 서술 ${BPTASKS.filter(t => t.mod).length} (${tf})`], ['백지 복습 과제', BPTASKS.length], ['암기법', `${MNEMONICS.length} / 30`], ['비교표', `${COMPARE.length} / 9`], ['지식 지도', `${VISUALS.length} / 13`]] };
}

function doSearch(q) {
  const box = $('#sres'); const n = norm(q);
  if (!n) { box.classList.remove('on'); return; }
  const res = [];
  EVENTS.forEach(e => { if (norm(e.t + e.who + e.cue).includes(n)) res.push([`${fmtDate(e)} · ${e.t}`, '사건', `tl:${e.id}`]); });
  CONCEPTS.forEach(c => { if (norm(c.t + c.body + c.kw.join()).includes(n)) res.push([c.t, `개념 · ${MOD[c.mod].t}`, `learn/${c.mod}`]); });
  MNEMONICS.forEach(m => { if (norm(m.k + m.parts.flat().join()).includes(n)) res.push([m.k, '암기법', `learn/mnemo`]); });
  box.innerHTML = res.length ? res.slice(0, 24).map(r => `<button data-a="sgo" data-to="${r[2]}"><b>${esc(r[0])}</b> <span class="tiny">${esc(r[1])}</span></button>`).join('') : '<div class="empty" style="padding:14px">검색 결과 없음</div>';
  box.classList.add('on');
}
